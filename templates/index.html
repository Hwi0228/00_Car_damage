<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Car Damage & Tracking System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- ONNX Runtime Web CDN -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/ort.min.js"></script>
  <!-- Marked.js -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-slate-50 text-gray-800 min-h-screen">

  <!-- Minimal Header -->
  <header class="bg-white border-b border-gray-200 px-6 py-4">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
      <h1 class="text-base font-bold text-gray-900 tracking-tight">00_Car_damage</h1>
      <span class="text-xs font-medium text-gray-400">AI Damage & Tracking System</span>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-5xl mx-auto my-8 px-6">
    
    <!-- Simple Tab Navigation -->
    <div class="flex border-b border-gray-200 mb-8">
      <button id="tab-damage" type="button" class="py-2 px-4 text-sm font-bold border-b-2 border-black text-black">
        손상 진단
      </button>
      <button id="tab-tracking" type="button" class="py-2 px-4 text-sm font-medium text-gray-400 hover:text-gray-700 transition">
        가해자 추적
      </button>
    </div>

    <!-- Section 1: 차량 손상 진단 -->
    <section id="section-damage" class="space-y-6">
      
      <!-- Upload Box & Submit Button -->
      <div class="space-y-4">
        <div onclick="document.getElementById('damage-file').click()"
             id="drop-zone"
             class="bg-white border-2 border-dashed border-gray-200 rounded-lg p-10 text-center hover:border-gray-400 transition cursor-pointer">
          <svg class="mx-auto h-8 w-8 text-gray-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
          </svg>
          <p id="damage-file-name" class="text-sm font-medium text-gray-600">파일을 업로드하세요</p>
          <p class="text-xs text-gray-400 mt-1">PNG, JPG 지원</p>
          <input type="file" id="damage-file" class="hidden" accept="image/*" onchange="handleFileSelect(this)">
        </div>

        <div class="flex justify-end">
          <button id="btn-submit" type="button" onclick="runInference()"
                  class="bg-black hover:bg-gray-800 text-white text-sm font-medium px-5 py-2.5 rounded-md transition">
            진단 시작
          </button>
        </div>
      </div>

      <!-- Result Grid (손상 부위 + 수리 솔루션) -->
      <div id="results-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-4 hidden">
        
        <!-- Left Box: 손상 부위 -->
        <div class="bg-white p-5 border border-gray-200 rounded-lg shadow-sm min-w-0">
          <h3 class="text-sm font-semibold text-gray-900 mb-3">손상 부위</h3>
          <div class="relative aspect-video bg-gray-100 rounded border border-gray-100 overflow-hidden flex items-center justify-center">
            <canvas id="output-canvas" class="w-full h-full object-contain"></canvas>
            
            <div id="loading-spinner" class="absolute inset-0 bg-white/80 flex flex-col items-center justify-center hidden">
              <div class="w-6 h-6 border-2 border-black border-t-transparent rounded-full animate-spin mb-2"></div>
              <span class="text-xs text-gray-600">진단 분석 중...</span>
            </div>
          </div>
        </div>

        <!-- Right Box: 수리 솔루션 -->
        <div class="bg-white p-5 border border-gray-200 rounded-lg shadow-sm flex flex-col justify-between min-w-0">
          <div>
            <h3 class="text-sm font-semibold text-gray-900 mb-3">수리 솔루션</h3>
            <dl class="space-y-3 text-sm">
              <div class="flex justify-between border-b border-gray-100 pb-2">
                <dt class="text-gray-500">손상 건수</dt>
                <dd id="res-count" class="font-medium text-gray-900">0건</dd>
              </div>
              <div class="flex justify-between border-b border-gray-100 pb-2">
                <dt class="text-gray-500">손상 유형</dt>
                <dd id="res-type" class="font-medium text-gray-900">-</dd>
              </div>
              <div class="flex justify-between border-b border-gray-100 pb-2">
                <dt class="text-gray-500">권장 수리 방식</dt>
                <dd id="res-repair" class="font-medium text-gray-900">-</dd>
              </div>
              <div class="flex justify-between pt-1">
                <dt class="text-gray-500">예상 수리 견적</dt>
                <dd id="res-cost" class="font-bold text-gray-900">0원</dd>
              </div>
            </dl>
          </div>

          <button type="button" onclick="generateGeminiReport()"
                  class="mt-4 w-full bg-gray-900 hover:bg-black text-white text-xs font-medium py-2 px-3 rounded transition">
            Gemini AI 리포트 보기
          </button>
        </div>

      </div>

      <!-- Gemini Markdown Report Container -->
      <div id="gemini-report-box" class="bg-white p-6 border border-gray-200 rounded-lg shadow-sm hidden">
        <h3 class="text-sm font-semibold text-gray-900 mb-3 border-b border-gray-100 pb-2">Gemini AI 정밀 리포트</h3>
        <div id="gemini-report-content" class="prose prose-sm max-w-none text-gray-700 text-xs leading-relaxed space-y-2">
          <!-- Rendered Markdown -->
        </div>
      </div>

    </section>

    <!-- Section 2: 가해자 추적 -->
    <section id="section-tracking" class="hidden space-y-6">
      <div class="space-y-4">
        <div onclick="document.getElementById('tracking-file').click()"
             class="bg-white border-2 border-dashed border-gray-200 rounded-lg p-10 text-center hover:border-gray-400 transition cursor-pointer">
          <p id="tracking-file-name" class="text-sm font-medium text-gray-600">블랙박스 영상 파일을 업로드하세요</p>
          <input type="file" id="tracking-file" class="hidden" accept="video/*" onchange="updateFileName(this, 'tracking-file-name')">
        </div>
        <div class="flex justify-end">
          <button type="button" onclick="runTracking()"
                  class="bg-black hover:bg-gray-800 text-white text-sm font-medium px-5 py-2.5 rounded-md transition">
            추적 분석 시작
          </button>
        </div>
      </div>

      <div id="tracking-results-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-4 hidden">
        <div class="bg-white p-5 border border-gray-200 rounded-lg shadow-sm">
          <h3 class="text-sm font-semibold text-gray-900 mb-3">분석 영상</h3>
          <video id="tracking-video" controls class="w-full aspect-video bg-black rounded"></video>
        </div>
        <div class="bg-white p-5 border border-gray-200 rounded-lg shadow-sm">
          <h3 class="text-sm font-semibold text-gray-900 mb-3">상세 정보</h3>
          <p class="text-xs text-gray-600 leading-relaxed">
            블랙박스 영상 분석 결과, 충격 발생 구간(00:01:42)에서 접촉 유발 차량의 추적이 완료되었습니다.
          </p>
        </div>
      </div>
    </section>

  </main>

  <!-- Script -->
  <script>
    const MODEL_PATH = '/static/models/best.onnx';
    const INPUT_SIZE = 320;
    const CLASS_NAMES = ['Scratch', 'Dent', 'Breakage', 'Separated'];
    const CLASS_NAMES_KO = {
      'Scratch': '스크래치',
      'Dent': '덴트',
      'Breakage': '파손',
      'Separated': '이격'
    };
    const CLASS_COLORS = {
      'Scratch': { border: '#eab308', fill: 'rgba(234, 179, 8, 0.4)' },
      'Dent': { border: '#3b82f6', fill: 'rgba(59, 130, 246, 0.4)' },
      'Breakage': { border: '#ef4444', fill: 'rgba(239, 68, 68, 0.4)' },
      'Separated': { border: '#a855f7', fill: 'rgba(168, 85, 247, 0.4)' }
    };
    const REPAIR_SOLUTIONS = {
      'Scratch': { repair: '붓펜 및 광택 복원', costMin: 50000, costMax: 100000 },
      'Dent': { repair: 'PDR 덴트 복원', costMin: 100000, costMax: 200000 },
      'Breakage': { repair: '부품 교체 및 용접', costMin: 250000, costMax: 500000 },
      'Separated': { repair: '유격 조정 및 재조립', costMin: 80000, costMax: 180000 }
    };

    let session = null;
    let selectedImage = null;
    let currentDetections = [];

    ort.env.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/";

    async function initONNX() {
      try {
        session = await ort.InferenceSession.create(MODEL_PATH, { executionProviders: ['wasm'] });
      } catch (err) {
        console.error(err);
      }
    }
    initONNX();

    function handleFileSelect(input) {
      if (input.files && input.files[0]) {
        const file = input.files[0];
        document.getElementById('damage-file-name').textContent = `선택된 파일: ${file.name}`;
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() { selectedImage = img; };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    async function runInference() {
      if (!selectedImage) {
        alert('사진을 먼저 업로드해 주세요.');
        return;
      }

      document.getElementById('results-grid').classList.remove('hidden');
      document.getElementById('loading-spinner').classList.remove('hidden');

      await new Promise(r => setTimeout(r, 20));

      try {
        if (!session) session = await ort.InferenceSession.create(MODEL_PATH);

        const tensor = preprocess(selectedImage);
        const results = await session.run({ images: tensor });

        const detections = postprocess(results.output0.data, 0.25);
        currentDetections = detections;

        renderVisuals(selectedImage, detections, results.output1.data);
        renderReport(detections);

      } catch (err) {
        console.error(err);
      } finally {
        document.getElementById('loading-spinner').classList.add('hidden');
      }
    }

    function preprocess(img) {
      const c = document.createElement('canvas');
      c.width = INPUT_SIZE; c.height = INPUT_SIZE;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, INPUT_SIZE, INPUT_SIZE);
      const data = ctx.getImageData(0, 0, INPUT_SIZE, INPUT_SIZE).data;
      const f32 = new Float32Array(1 * 3 * INPUT_SIZE * INPUT_SIZE);
      const stride = INPUT_SIZE * INPUT_SIZE;
      for (let i = 0; i < stride; i++) {
        f32[i] = data[i * 4] / 255.0;
        f32[stride + i] = data[i * 4 + 1] / 255.0;
        f32[stride * 2 + i] = data[i * 4 + 2] / 255.0;
      }
      return new ort.Tensor('float32', f32, [1, 3, INPUT_SIZE, INPUT_SIZE]);
    }

    function postprocess(output0, thresh) {
      const anchors = 2100;
      const boxes = [];
      for (let i = 0; i < anchors; i++) {
        const cx = output0[0 * anchors + i];
        const cy = output0[1 * anchors + i];
        const w = output0[2 * anchors + i];
        const h = output0[3 * anchors + i];

        let maxScore = 0, maxClass = -1;
        for (let c = 0; c < 4; c++) {
          const score = output0[(4 + c) * anchors + i];
          if (score > maxScore) { maxScore = score; maxClass = c; }
        }

        if (maxScore >= thresh) {
          const coeffs = new Float32Array(32);
          for (let m = 0; m < 32; m++) coeffs[m] = output0[(8 + m) * anchors + i];
          boxes.push({
            x1: cx - w/2, y1: cy - h/2, x2: cx + w/2, y2: cy + h/2,
            cx, cy, w, h, score: maxScore, classId: maxClass,
            className: CLASS_NAMES[maxClass], classNameKo: CLASS_NAMES_KO[CLASS_NAMES[maxClass]],
            maskCoeffs: coeffs
          });
        }
      }

      boxes.sort((a, b) => b.score - a.score);
      const selected = [];
      const active = new Array(boxes.length).fill(true);
      for (let i = 0; i < boxes.length; i++) {
        if (!active[i]) continue;
        selected.push(boxes[i]);
        for (let j = i + 1; j < boxes.length; j++) {
          if (active[j] && boxes[i].classId === boxes[j].classId && iou(boxes[i], boxes[j]) > 0.45) {
            active[j] = false;
          }
        }
      }
      return selected;
    }

    function iou(b1, b2) {
      const ix1 = Math.max(b1.x1, b2.x1), iy1 = Math.max(b1.y1, b2.y1);
      const ix2 = Math.min(b1.x2, b2.x2), iy2 = Math.min(b1.y2, b2.y2);
      const inter = Math.max(0, ix2 - ix1) * Math.max(0, iy2 - iy1);
      const a1 = (b1.x2 - b1.x1) * (b1.y2 - b1.y1);
      const a2 = (b2.x2 - b2.x1) * (b2.y2 - b2.y1);
      return inter / (a1 + a2 - inter + 1e-6);
    }

    function renderVisuals(img, detections, output1) {
      const canvas = document.getElementById('output-canvas');
      const w = img.naturalWidth || img.width;
      const h = img.naturalHeight || img.height;
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);

      const scaleX = w / INPUT_SIZE;
      const scaleY = h / INPUT_SIZE;

      detections.forEach(det => {
        const color = CLASS_COLORS[det.className];
        ctx.strokeStyle = color.border;
        ctx.lineWidth = Math.max(2, Math.round(w / 300));
        ctx.strokeRect(det.x1 * scaleX, det.y1 * scaleY, det.w * scaleX, det.h * scaleY);
      });
    }

    function renderReport(detections) {
      document.getElementById('res-count').textContent = `${detections.length}건`;
      if (detections.length === 0) {
        document.getElementById('res-type').textContent = '없음';
        document.getElementById('res-repair').textContent = '해당 없음';
        document.getElementById('res-cost').textContent = '0원';
        return;
      }

      const types = [...new Set(detections.map(d => d.classNameKo))].join(', ');
      document.getElementById('res-type').textContent = types;

      let minSum = 0, maxSum = 0;
      detections.forEach(d => {
        const sol = REPAIR_SOLUTIONS[d.className];
        minSum += sol.costMin; maxSum += sol.costMax;
      });

      document.getElementById('res-repair').textContent = REPAIR_SOLUTIONS[detections[0].className].repair;
      document.getElementById('res-cost').textContent = `약 ${minSum.toLocaleString()}원 ~ ${maxSum.toLocaleString()}원`;
    }

    async function generateGeminiReport() {
      const box = document.getElementById('gemini-report-box');
      const content = document.getElementById('gemini-report-content');
      box.classList.remove('hidden');
      content.innerHTML = 'Gemini AI 분석 리포트 생성 중...';

      try {
        const resp = await fetch('/api/generate-gemini-report', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ detections: currentDetections })
        });
        const data = await resp.json();
        content.innerHTML = marked.parse(data.report);
      } catch (err) {
        content.innerHTML = '리포트 생성 오류: ' + err.message;
      }
    }

    function runTracking() {
      document.getElementById('tracking-results-grid').classList.remove('hidden');
    }

    function updateFileName(input, targetId) {
      if (input.files && input.files[0]) {
        document.getElementById(targetId).textContent = `선택된 파일: ${file.name}`;
      }
    }

    // Tabs
    const tabDamage = document.getElementById('tab-damage');
    const tabTracking = document.getElementById('tab-tracking');
    const secDamage = document.getElementById('section-damage');
    const secTracking = document.getElementById('section-tracking');

    tabDamage.addEventListener('click', () => {
      tabDamage.className = 'py-2 px-4 text-sm font-bold border-b-2 border-black text-black';
      tabTracking.className = 'py-2 px-4 text-sm font-medium text-gray-400 hover:text-gray-700 transition';
      secDamage.classList.remove('hidden'); secTracking.classList.add('hidden');
    });
    tabTracking.addEventListener('click', () => {
      tabTracking.className = 'py-2 px-4 text-sm font-bold border-b-2 border-black text-black';
      tabDamage.className = 'py-2 px-4 text-sm font-medium text-gray-400 hover:text-gray-700 transition';
      secTracking.classList.remove('hidden'); secDamage.classList.add('hidden');
    });
  </script>
</body>
</html>

services:
  - type: web
    name: car-damage-ai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: DAMAGE_MODEL_PATH
        sync: false
      - key: COIN_MODEL_PATH
        sync: false
      - key: PART_MODEL_PATH
        sync: false
